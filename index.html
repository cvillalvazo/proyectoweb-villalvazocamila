<!DOCTYPE html>
<!--Doctype indica el tipo de documento es HTML-->
<!--ENTREGABLE 2-->
<!--Este desarrollo web es de CAMILA VILLALVAZO-->

<html lang="es">
    <!--lang esta indicado que es es espanol-->
<head>
    <!--Dentro de Head van las configuraciones de la app o sitio web-->
    <meta charset="UTF-8">
    <!--este meta dato permite todos los caracteres-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--El meta dato de viewport es para que se adapte a cualquier pantalla-->
    <meta name="author" content="Camila Villalvazo">
    <title>Cafetería</title>
    <!--El título como voy a aparecer en la web-->
    <link rel="stylesheet" href="css/style.css">
    <!--link rel enlaza con la carpeta y archivo del css-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
    <div class="container header-inner">
      <a class="logo" href="#">
        <img src="img/logocafe.jpg" alt="Logo Cafetería" height="70" />
      <nav class="main-nav" id="mainNav">
        <ul>
          <li><a href="#menu">Menu</a></li>
          <li><a href="#reservas">Reservas</a></li>
          <li><a href="#contacto">Contacto</a></li>
          <li><a class="btn-shop" href="#shop">Shop</a></li>
        </ul>
      </nav>
      <button id="menuToggle" class="menu-toggle">☰</button>
    </div>
  </header>

  <!--Aquí inicia el footer-->
  <footer>

  <div class="footer-social">
    <div class="container social-icons">

      <a href="https://www.facebook.com/" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>

      <a href="https://www.instagram.com/" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>

      <a href="https://www.youtube.com/" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>

      <a href="https://www.linkedin.com/" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>

      <a href="https://x.com/" aria-label="X (Twitter)">
        <i class="fa-brands fa-x-twitter"></i>
      </a>

    </div>
  </div>

  <div class="footer-bottom">
    <div class="container">
      &copy; <span id="anio"></span> DEL NORTH CAPS
    </div>
  </div>

</footer>
   
</body>
</html>
